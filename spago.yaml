package:
  name: identy
  build:
    strict: true
  publish:
    version: 4.0.2
    license: MIT
    location:
      githubOwner: oreshinya
      githubRepo: purescript-identy
  dependencies:
    - arrays: ">=7.1.0 <8.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign: ">=7.0.0 <8.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - simple-json: ">=9.0.0 <10.0.0"
    - st: ">=6.2.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    dependencies:
      - effect: ">=4.0.0 <5.0.0"
      - test-unit: ">=17.0.0 <18.0.0"
workspace:
  buildOpts:
    censorLibraryWarnings: all
