name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1

    - name: Setup nodejs
      uses: actions/setup-node@v1
      with:
        node-version: 22

    - name: Cache npm modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Cache spago modules
      uses: actions/cache@v4
      with:
        path: .spago
        key: ${{ runner.os }}-deps-${{ hashFiles('spago.yaml') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm test
